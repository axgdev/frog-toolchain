name: Build Toolchains

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  build-alpine:
    name: Build (${{ matrix.channel }}-alpine-3.23-${{ matrix.host_arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: edge
            config_file: .config.edge
            host_arch: x86_64
            runs_on: ubuntu-22.04
          - channel: edge
            config_file: .config.edge
            host_arch: arm64
            runs_on: ubuntu-22.04-arm
          - channel: stable
            config_file: .config.stable-v1.0.0
            host_arch: x86_64
            runs_on: ubuntu-22.04
          - channel: stable
            config_file: .config.stable-v1.0.0
            host_arch: arm64
            runs_on: ubuntu-22.04-arm
          - channel: nuttx
            config_file: .config.nuttx
            host_arch: x86_64
            runs_on: ubuntu-22.04
          - channel: nuttx
            config_file: .config.nuttx
            host_arch: arm64
            runs_on: ubuntu-22.04-arm
          - channel: uclibc
            config_file: .config.uclibc
            host_arch: x86_64
            runs_on: ubuntu-22.04
          - channel: uclibc
            config_file: .config.uclibc
            host_arch: arm64
            runs_on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      # Everything else (channel detection, patch scoping, static-toolchain
      # switch, artifact naming, validation) lives in the Makefile so the
      # same targets can be run locally: see the README.
      - name: Select channel config
        run: make use-config CONFIG=${{ matrix.config_file }}

      - name: Cache tarballs
        uses: actions/cache@v4
        with:
          path: .tarballs
          key: tarballs-${{ matrix.channel }}-${{ runner.os }}-${{ runner.arch }}-alpine-3.23-${{ hashFiles('.config') }}

      # ccache is keyed on the config and all patches: any change to either
      # starts from a fresh cache.  ccache itself is also self-validating
      # (compiler content + source hashes), so a stale cache can only ever
      # cost a miss, never serve a stale object.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.channel }}-${{ runner.os }}-${{ runner.arch }}-alpine-3.23-${{ hashFiles('.config', 'patches/**') }}

      - name: Compute artifact name
        run: |
          echo "ARTIFACT_NAME=$(make -s artifact-name)" >> "$GITHUB_ENV"

      - name: Validate local patches
        run: make ci-validate

      # The entire container-side build (apk deps, patched/stock ct-ng
      # install, toolchain build as the unprivileged 'builder' user, pack)
      # lives in the Makefile's ci-in-container target, so the same docker
      # invocation can be run locally with: make docker-ci CONFIG=...
      - name: Build and pack toolchain
        run: make docker-ci CONFIG=${{ matrix.config_file }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

  release:
    name: Publish Release
    needs: build-alpine
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: toolchains-${{ env.TAG_NAME }}-edge-stable-nuttx-uclibc-static-x86_64-arm64
          draft: ${{ github.event.release.draft || false }}
          prerelease: ${{ github.event.release.prerelease || false }}
          files: dist/**/toolchain-*.tar.xz
